apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter-api
  namespace: newsletter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsletter-api
  template:
    metadata:
      labels:
        app: newsletter-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/newsletter-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: API_PORT
              value: "8080"
            - name: MONGO_DATABASE
              value: "newsletter"
            - name: MONGO_URI
              value: "mongodb://newsletter-mongodb:27017"
            - name: SMTP_HOST
              value: "smtp.example.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: "no-reply@example.com"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: newsletter-api-secret
                  key: SMTP_USER
            - name: DEFAULT_TZ
              value: "UTC"
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: newsletter-api-secret
                  key: SMTP_PASS
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: newsletter-api
  namespace: newsletter
spec:
  selector:
    app: newsletter-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newsletter-api
  namespace: newsletter
spec:
  rules:
    - host: newsletter.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: newsletter-api
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter-mongodb
  namespace: newsletter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsletter-mongodb
  template:
    metadata:
      labels:
        app: newsletter-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: newsletter-mongodb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newsletter-mongodb-pvc
  namespace: newsletter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: newsletter-mongodb
  namespace: newsletter
spec:
  selector:
    app: newsletter-mongodb
  ports:
    - port: 27017
      targetPort: 27017

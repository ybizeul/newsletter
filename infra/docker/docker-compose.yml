services:
  mongo:
    image: mongo:7
    container_name: newsletter-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: newsletter-api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: newsletter
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_FROM: no-reply@example.com
      SMTP_USER: ""
      SMTP_PASS: ""

volumes:
  mongo_data:
